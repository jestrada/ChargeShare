name: Synthetic telemetry integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  receiver-kafka:
    name: Receiver to Kafka synthetic round trip
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned official Nix
        id: nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          install_url: https://releases.nixos.org/nix/nix-2.28.6/install
          enable_kvm: false
          set_as_trusted_user: false
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Verify locked shell entry twice
        run: |
          mkdir -p target/harness-results
          sha256sum flake.lock > target/harness-results/lock-before.txt
          nix develop --no-update-lock-file -c bash scripts/dev/versions.sh > target/harness-results/versions.txt
          nix develop --no-update-lock-file -c bash scripts/dev/versions.sh > target/harness-results/versions-second.txt
          sha256sum flake.lock > target/harness-results/lock-after.txt
          cmp target/harness-results/lock-before.txt target/harness-results/lock-after.txt
          cmp target/harness-results/versions.txt target/harness-results/versions-second.txt
      - name: Start, explicitly test and always tear down the synthetic stack
        run: nix develop --no-update-lock-file -c timeout --signal=TERM --kill-after=30s 40m bash scripts/dev/integration.sh
      - name: Ensure project teardown even after an interrupted integration step
        if: always() && steps.nix.outcome == 'success'
        run: nix develop --no-update-lock-file -c bash scripts/dev/cleanup.sh
      - name: Retain only allowlisted synthetic summaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-receiver-kafka-results
          path: |
            target/harness-results/summary.md
            target/harness-results/versions.txt
            target/harness-results/normalized-first.json
            target/harness-results/normalized-second.json
          retention-days: 7
          if-no-files-found: warn
