name: Durable synthetic ingestion acceptance

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      prove_failure:
        description: Deliberate gate failure; restore none in a separate run
        type: choice
        options:
          - none
          - setup
          - assertion
          - timeout
        default: none

concurrency:
  # Metadata-only events (body edits, label changes) get their own group so they never cancel the heavy run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ contains(fromJSON('["edited","labeled","unlabeled"]'), github.event.action) && 'meta' || 'full' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  evidence-check:
    name: Linked issue evidence
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Require spec-approved linked issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name' | grep -qx 'no-spec'; then
            echo "::notice::PR has the no-spec label; skipping spec check."
            exit 0
          fi
          body=$(gh api "repos/$REPO/pulls/$PR" --jq '.body // ""')
          issues=$(grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]*:?[[:space:]]+#[0-9]+' <<<"$body" | grep -oE '[0-9]+$' | sort -un || true)
          if [ -z "$issues" ]; then
            echo "::error::PR links no issue. Add 'Closes #N' to the body or apply the no-spec label."
            exit 1
          fi
          fail=0
          for n in $issues; do
            if gh api "repos/$REPO/issues/$n/labels" --jq '.[].name' | grep -qx 'spec-approved'; then
              echo "Issue #$n is spec-approved."
            else
              echo "::error::Issue #$n lacks the spec-approved label. After Joseph adds it, re-run this job or edit the PR."
              fail=1
            fi
          done
          exit "$fail"
      - name: Require an image comment on linked issues
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          labels=$(gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name')
          if grep -qx 'no-evidence' <<<"$labels"; then
            echo "::notice::PR has the no-evidence label; skipping evidence check."
            exit 0
          fi
          body=$(gh api "repos/$REPO/pulls/$PR" --jq '.body // ""')
          issues=$(grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]*:?[[:space:]]+#[0-9]+' <<<"$body" | grep -oE '[0-9]+$' | sort -un || true)
          if [ -z "$issues" ]; then
            echo "No linked issues; nothing to check."
            exit 0
          fi
          pr_created=$(gh api "repos/$REPO/pulls/$PR" --jq '.created_at')
          first_commit=$(gh api "repos/$REPO/pulls/$PR/commits?per_page=1" --jq '.[0].commit.committer.date // .[0].commit.author.date')
          since=$(printf '%s\n%s\n' "$(date -u -d "$pr_created" +%FT%TZ)" "$(date -u -d "$first_commit" +%FT%TZ)" | sort | head -1)
          echo "Evidence must be posted after $since"
          fail=0
          for n in $issues; do
            count=$(gh api --paginate "repos/$REPO/issues/$n/comments" \
              --jq "[.[] | select(.created_at > \"$since\") | select(.body | test(\"!\\\\[[^\\\\]]*\\\\]\\\\([^)]+\\\\)|<img\"; \"i\"))] | length" | awk '{s+=$1} END {print s+0}')
            if [ "$count" -gt 0 ]; then
              echo "Issue #$n has evidence."
            else
              echo "::error::Issue #$n has no comment with an image posted after $since. Add a screenshot comment or apply the no-evidence label."
              fail=1
            fi
          done
          exit "$fail"

  ingestion-acceptance:
    name: Receiver to SQLite scoped replay
    # Skip the heavy run for metadata-only PR events; code changes still run it.
    if: github.event_name != 'pull_request' || !contains(fromJSON('["edited","labeled","unlabeled"]'), github.event.action)
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned official Nix
        id: nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          install_url: https://releases.nixos.org/nix/nix-2.28.6/install
          enable_kvm: false
          set_as_trusted_user: false
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Restore pinned tools
        uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: nix-2.28.6-ubuntu24-x86_64-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml') }}
      - name: Verify locked shell and focused ingestion guards
        run: |
          mkdir -p .cache/ingestion-acceptance/tmp target/ingestion-acceptance-results
          chmod 700 .cache/ingestion-acceptance .cache/ingestion-acceptance/tmp
          export TMPDIR="$PWD/.cache/ingestion-acceptance/tmp"
          sha256sum flake.lock > .cache/ingestion-acceptance/lock-before.txt
          nix develop --no-update-lock-file -c bash scripts/dev/versions.sh > target/ingestion-acceptance-results/versions.txt
          nix develop --no-update-lock-file -c cargo fmt --all -- --check
          nix develop --no-update-lock-file -c cargo clippy --workspace --all-targets --locked -- -D warnings
          nix develop --no-update-lock-file -c bash scripts/testing/ingestion-suite.sh
          nix develop --no-update-lock-file -c python3 scripts/testing/test_ingestion_guard.py
          nix develop --no-update-lock-file -c python3 -m unittest discover -s scripts/dev -p 'test_*.py'
          nix develop --no-update-lock-file -c python3 -m unittest dev/fixtures/test_dashboard.py
          nix develop --no-update-lock-file -c npm --cache .cache/npm --prefix apps/web ci
          nix develop --no-update-lock-file -c npm --prefix apps/web run lint
          nix develop --no-update-lock-file -c npm --prefix apps/web test
          nix develop --no-update-lock-file -c npm run preview:build
          nix develop --no-update-lock-file -c npm --prefix apps/web run build:persisted
          sha256sum flake.lock > .cache/ingestion-acceptance/lock-after.txt
          cmp .cache/ingestion-acceptance/lock-before.txt .cache/ingestion-acceptance/lock-after.txt
      - name: Cache only tools before generating test credentials
        uses: nix-community/cache-nix-action/save@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: nix-2.28.6-ubuntu24-x86_64-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml') }}
      - name: Select pinned receiver inputs
        id: receiver-inputs
        run: nix develop --no-update-lock-file -c python3 scripts/dev/cached_receiver.py identity
      - name: Set up pinned receiver builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          version: v0.38.0
          driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
      - name: Build and load unpatched receiver
        id: receiver-build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
          DOCKER_BUILD_SUMMARY: 'false'
        with:
          context: dev
          file: dev/receiver.Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ steps.receiver-inputs.outputs.tag }}
          labels: |
            dev.chargeshare.receiver-build-inputs=${{ steps.receiver-inputs.outputs.inputs_sha }}
            org.opencontainers.image.revision=${{ steps.receiver-inputs.outputs.revision }}
          cache-from: type=gha,version=2,scope=${{ steps.receiver-inputs.outputs.cache_scope }}
          cache-to: type=gha,version=2,scope=${{ steps.receiver-inputs.outputs.cache_scope }},mode=max,timeout=5m
      - name: Run the shared bounded acceptance command
        env:
          CHARGESHARE_CI_PREBUILT_RECEIVER: '1'
          CHARGESHARE_CI_RECEIVER_IMAGE_ID: ${{ steps.receiver-build.outputs.imageid }}
          CHARGESHARE_ACCEPTANCE_PROVE_FAILURE: ${{ inputs.prove_failure || 'none' }}
        run: nix develop --no-update-lock-file -c bash scripts/dev/acceptance.sh all --prove-failure "$CHARGESHARE_ACCEPTANCE_PROVE_FAILURE"
      - name: Ensure owned teardown after interruption
        if: always() && steps.nix.outcome == 'success'
        run: |
          export DOCKER_CONFIG="$PWD/.cache/ingestion-acceptance/docker"
          export WINDMILL_DIR="$PWD/.cache/ingestion-acceptance/tilt"
          nix develop --no-update-lock-file -c bash scripts/dev/cleanup.sh
      - name: Retain only allowlisted summaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-ingestion-acceptance
          path: |
            target/ingestion-acceptance-results/summary.md
            target/ingestion-acceptance-results/versions.txt
            target/ingestion-test-results/summary.md
          retention-days: 7
          if-no-files-found: warn
